[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elder-companion"
version = "0.1.0"
description = "Personal AI companion for older adults and other high-LTV niches"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
elder-companion = "elder_companion.__main__:main"

[tool.setuptools]
packages = ["elder_companion"]
